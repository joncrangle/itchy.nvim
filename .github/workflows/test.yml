name: Tests

on:
  push:
    branches: [master]
    paths:
      - "tests/**"
      - "lua/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "tests/**"
      - "lua/**"
      - ".github/workflows/test.yml"

jobs:
  # Sync strategy: the callback-based vim.system backend on the 0.11
  # compatibility floor, across all supported OSes.
  test-sync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        neovim_version: ["v0.11.0"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Setup dependencies for Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Chrome's apt repo is unrelated to our deps and intermittently
          # serves inconsistent metadata (Hash Sum mismatch); drop every
          # source referencing it (list filename varies by image) so a
          # broken upstream mirror cannot fail dependency setup.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck
          sudo apt-get install -y python3 nodejs npm zsh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          if ! command -v go &> /dev/null; then
            wget https://go.dev/dl/go1.24.2.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf go1.24.2.linux-amd64.tar.gz
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi
          sudo snap install powershell --classic

      - name: Setup dependencies for macOS
        if: matrix.os == 'macos-latest'
        run: |
          brew trust --formula azure/bicep/bicep
          brew trust aws/tap
          brew install lua luarocks
          luarocks install luacheck
          brew install uv
          brew install deno
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          brew install go
          brew install --cask powershell || brew install --cask powershell@preview

      # - name: Setup Windows dependencies
      #   if: matrix.os == 'windows-latest'
      #   shell: pwsh
      #   run: |
      #     iwr -useb get.scoop.sh | iex
      #       scoop install lua luarocks pwsh
      #       luarocks install luafilesystem --server=https://luarocks.org/dev
      #       $allPaths = @(
      #         "C:\Windows\System32",
      #         "C:\Windows",
      #         "C:\Windows\System32\WindowsPowerShell\v1.0",
      #         "$env:ProgramFiles\PowerShell\7",
      #         "$env:ProgramFiles\PowerShell\7\bin",
      #         "$env:USERPROFILE\scoop\shims"
      #       )
      #       foreach ($path in $allPaths) {
      #         if (Test-Path $path) {
      #           echo $path | Out-File -FilePath $env:GITHUB_PATH -Append
      #         }
      #       }
      #       $rocks_tree = "$env:USERPROFILE\scoop\apps\luarocks\current\rocks"
      #       $env:LUA_PATH = "$rocks_tree\share\lua\5.4\?.lua;$rocks_tree\share\lua\5.4\?\init.lua;;"
      #       $env:LUA_CPATH = "$rocks_tree\lib\lua\5.4\?.dll;;"
      #       echo "LUA_PATH=$($env:LUA_PATH)" | Out-File -FilePath $env:GITHUB_ENV -Append
      #       echo "LUA_CPATH=$($env:LUA_CPATH)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test Cache
        uses: actions/cache@v6
        with:
          path: .tests
          key: ${{ runner.os }}-tests-${{ hashFiles('tests/minit.lua') }}

      - name: Cache interpreter artifacts (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/uv
            ~/.cache/deno
            ~/.bun/install/cache
          key: ubuntu-interp-${{ hashFiles('tests/test_files/**') }}
          restore-keys: |
            ubuntu-interp-

      - name: Warm Go build cache (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) {
            $env:GO111MODULE = 'off'
            go build -o NUL tests/test_files/go.go
          }

      - name: Setup MSVC for Tree-sitter parser build (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Assert expected backend is selected
        if: matrix.os != 'windows-latest'
        run: nvim --headless --noplugin -u NONE --cmd "set rtp+=." -l tests/backend_check.lua

      - name: Assert expected backend is selected (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: nvim --headless --noplugin -u NONE --cmd "set rtp+=." -l tests/backend_check.lua

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        run: nvim -l tests/minit.lua --minitest

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: nvim -l tests/minit.lua --minitest

  # Async strategy: the vim.async backend. Nightly provides 0.13+ today and
  # keeps tracking post-release development, so this needs no edits when
  # 0.13 ships. Ubuntu only: the Task/closable machinery is OS-independent
  # Lua, while OS-specific process semantics (including Windows kill
  # behavior) are covered by the sync matrix above.
  test-async:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Neovim nightly (0.13-dev)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - name: Setup dependencies
        run: |
          # Chrome's apt repo is unrelated to our deps and intermittently
          # serves inconsistent metadata (Hash Sum mismatch); drop every
          # source referencing it (list filename varies by image) so a
          # broken upstream mirror cannot fail dependency setup.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list*
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks python3 nodejs npm zsh
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          if ! command -v go &> /dev/null; then
            wget https://go.dev/dl/go1.24.2.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf go1.24.2.linux-amd64.tar.gz
            echo "/usr/local/go/bin" >> $GITHUB_PATH
          fi

      - name: Test Cache
        uses: actions/cache@v6
        with:
          path: .tests
          key: ubuntu-nightly-tests-${{ hashFiles('tests/minit.lua') }}

      - name: Cache interpreter artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/uv
            ~/.cache/deno
            ~/.bun/install/cache
          key: ubuntu-interp-${{ hashFiles('tests/test_files/**') }}
          restore-keys: |
            ubuntu-interp-

      - name: Assert vim.async backend is selected
        run: nvim --headless --noplugin -u NONE --cmd "set rtp+=." -l tests/backend_check.lua

      - name: Run tests (nightly, async backend)
        run: nvim -l tests/minit.lua --minitest
